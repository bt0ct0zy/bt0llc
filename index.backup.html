<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bt0ct0zy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'JetBrains+Mono', monospace;
    }

    #bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100vw;
      min-height: 100vh;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: 1;
    }

    .content {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 4;
      pointer-events: none;
    }

    /* Монохромный переливающийся ник */
    .nickname {
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 3px;
      
      background: linear-gradient(
        110deg,
        #ffffff 0%,
        #ffffff 25%,
        #3a3a3a 50%,
        #ffffff 75%,
        #ffffff 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      
      animation: silver-flow 3.5s linear infinite;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.45));
      
      transition: transform 0.2s ease, filter 0.2s ease;
      pointer-events: auto;
      cursor: default;
    }

    .nickname:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.8));
    }

    @keyframes silver-flow {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    /* Счетчик просмотров */
    .bottom-left {
      position: fixed;
      bottom: 24px;
      left: 28px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.82rem;
      letter-spacing: 1px;
    }

    .bottom-left svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Ссылка на мейн био */
    .bottom-right {
      position: fixed;
      bottom: 24px;
      right: 28px;
      z-index: 4;
    }

    .bottom-right a {
      color: rgba(255, 255, 255, 0.35);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 1px;
      transition: color 0.2s ease;
    }

    .bottom-right a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <video id="bg-video" autoplay loop muted playsinline preload="auto">
    <source src="video.mp4" type="video/mp4">
  </video>

  <div class="content">
    <h1 class="nickname">bt0ct0zy</h1>
  </div>

  <div class="bottom-left">
    <svg viewBox="0 0 24 24">
      <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
    </svg>
    <span>1,337</span>
  </div>

  <div class="bottom-right">
    <a href="#" target="_blank">[ main bio ]</a>
  </div>

  <script>
    const video = document.getElementById('bg-video');

    // Автоматический запуск видео
    video.play().catch(err => {
      console.error("Playback failed:", err);
    });

    // Включение звука при первом клике / взаимодействии
    const enableAudio = () => {
      video.muted = false;
    };
    document.addEventListener('click', enableAudio, { once: true });
    document.addEventListener('touchstart', enableAudio, { once: true });
  </script>
</body>
</html>
