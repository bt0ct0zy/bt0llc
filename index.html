<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>bt0ct0zy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'JetBrains Mono', monospace;
    }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center center;
      z-index: 1;
      pointer-events: none;
    }

    .content {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 4;
      pointer-events: none;
    }

    /* Монохромный переливающийся ник */
    .nickname {
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 3px;
      
      background: linear-gradient(
        110deg,
        #ffffff 0%,
        #ffffff 25%,
        #3a3a3a 50%,
        #ffffff 75%,
        #ffffff 100%
      );
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      
      animation: silver-flow 3.5s linear infinite;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.45));
      
      transition: transform 0.2s ease, filter 0.2s ease;
      pointer-events: auto;
      cursor: default;
    }

    .nickname:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.8));
    }

    @keyframes silver-flow {
      0% {
        background-position: 200% 0;
      }
      100% {
        background-position: -200% 0;
      }
    }

    /* Кнопка переключения звука */
    .sound-toggle {
      position: fixed;
      top: max(20px, env(safe-area-inset-top, 20px));
      right: max(24px, env(safe-area-inset-right, 24px));
      z-index: 10;
      background: rgba(10, 10, 10, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: rgba(255, 255, 255, 0.65);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.25s ease;
      outline: none;
    }

    .sound-toggle:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
    }

    .sound-toggle.active {
      border-color: rgba(255, 255, 255, 0.3);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.15);
    }

    .sound-toggle svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* Счетчик просмотров */
    .bottom-left {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: max(24px, env(safe-area-inset-left, 24px));
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.82rem;
      letter-spacing: 1px;
    }

    .bottom-left svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Ссылка на мейн био */
    .bottom-right {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      right: max(24px, env(safe-area-inset-right, 24px));
      z-index: 4;
    }

    .bottom-right a {
      color: rgba(255, 255, 255, 0.35);
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 1px;
      transition: color 0.2s ease;
    }

    .bottom-right a:hover {
      color: #fff;
    }

    /* Адаптивность для мобильных */
    @media (max-width: 480px) {
      .nickname {
        font-size: 1.85rem;
        letter-spacing: 2px;
      }
      .bottom-left, .bottom-right a, .sound-toggle {
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>

  <video id="bg-video" autoplay loop muted playsinline webkit-playsinline x5-playsinline preload="auto">
    <source src="video.mp4?v=2" type="video/mp4">
  </video>

  <!-- Кнопка звука -->
  <button id="sound-btn" class="sound-toggle" aria-label="Toggle sound">
    <svg id="sound-icon-muted" viewBox="0 0 24 24">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
    <svg id="sound-icon-unmuted" viewBox="0 0 24 24" style="display: none;">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
    </svg>
    <span id="sound-text">sound: off</span>
  </button>

  <div class="content">
    <h1 class="nickname">bt0ct0zy</h1>
  </div>

  <div class="bottom-left">
    <svg viewBox="0 0 24 24">
      <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
    </svg>
    <span>1,337</span>
  </div>

  <div class="bottom-right">
    <a href="https://bt0ct0zy.github.io/bio/" target="_blank">[ main bio ]</a>
  </div>

  <script>
    const video = document.getElementById('bg-video');
    const soundBtn = document.getElementById('sound-btn');
    const iconMuted = document.getElementById('sound-icon-muted');
    const iconUnmuted = document.getElementById('sound-icon-unmuted');
    const soundText = document.getElementById('sound-text');

    // Автоматический запуск видео (muted)
    video.play().catch(err => {
      console.warn("Autoplay muted failed:", err);
    });

    function updateSoundUI(isUnmuted) {
      if (isUnmuted) {
        iconMuted.style.display = 'none';
        iconUnmuted.style.display = 'block';
        soundText.textContent = 'sound: on';
        soundBtn.classList.add('active');
      } else {
        iconMuted.style.display = 'block';
        iconUnmuted.style.display = 'none';
        soundText.textContent = 'sound: off';
        soundBtn.classList.remove('active');
      }
    }

    function unlockAudioHardware() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        try {
          const ctx = new AudioCtx();
          if (ctx.state === 'suspended') ctx.resume();
        } catch(e) {}
      }
    }

    function enableSound() {
      unlockAudioHardware();
      video.muted = false;
      video.volume = 1.0;
      const p = video.play();
      if (p !== undefined) {
        p.then(() => updateSoundUI(true))
         .catch(() => updateSoundUI(false));
      } else {
        updateSoundUI(true);
      }
    }

    function toggleSound(e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      if (video.muted) {
        enableSound();
      } else {
        video.muted = true;
        updateSoundUI(false);
      }
    }

    // Клик по кнопке звука
    soundBtn.addEventListener('click', toggleSound);

    // Клик/тап по экрану для включения звука
    let screenInteracted = false;
    const handleScreenTap = (e) => {
      if (e.target && e.target.closest('#sound-btn')) return;
      if (video.muted && !screenInteracted) {
        screenInteracted = true;
        enableSound();
      }
    };

    ['click', 'touchend'].forEach(evt => {
      document.addEventListener(evt, handleScreenTap, { passive: true });
    });
  </script>
</body>
</html>
